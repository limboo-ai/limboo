# electron-builder — branded installer + auto-update target builder.
#
# IMPORTANT: electron-builder is NOT the primary build tool here. Electron Forge
# still owns dev (`npm start`) and app packaging (`electron-forge package`), which
# applies the Vite build, the security fuses, and the asar / asar-unpack layout.
# This config is consumed only via `--prepackaged` (see scripts/dist.mjs), so
# electron-builder wraps the already-packaged app into installers WITHOUT
# re-packing it — the fuses + asar-integrity Forge baked in are preserved. For
# that reason there is deliberately no `electronFuses`, `files`, or `asar*` block
# here: the app directory is taken as-is.
#
# Regenerate the branded art with: npm run gen:installer

appId: dev.limboo.app
productName: Limboo
copyright: Copyright © 2026 BotCoder254

# Branded NSIS art + custom include live here (not the electron-builder default
# `build/`), keeping all installer assets under assets/.
directories:
  output: dist
  buildResources: assets/installer

# Publish provider for releases AND the auto-update feed electron-updater reads
# (it fetches latest*.yml from this repo's GitHub Releases).
#
# releaseType: release — publish straight to a full GitHub Release (which
# auto-creates the `v${version}` tag) rather than the electron-builder default
# `draft`. This matches the repo's existing releases (all non-draft), so a local
# `npm run publish` never hits the "existing type not compatible with publishing
# type" mismatch, and the auto-generated tag (v<version>) stays consistent with
# package.json. The version is the single source of truth: bump it (git tag or
# `node ci/scripts/apply-tag-version.mjs vX.Y.Z`) and the tag follows.
publish:
  provider: github
  owner: BotCoder254
  repo: limboo
  releaseType: release

# ---------------------------------------------------------------------------
# Windows — the branded, multi-page NSIS wizard (the "first screen of the app").
# ---------------------------------------------------------------------------
# NOTE ON `arch:` — deliberately omitted from EVERY target list below.
#
# electron-builder runs here with `--prepackaged`, and a prepackaged input holds
# exactly one architecture. An explicit `arch:` list OVERRIDES the CLI arch flag
# scripts/dist.mjs passes, and electron-builder then wraps that single directory
# once per listed arch — which is how v1.5.1 published an "Intel" dmg and zip
# that were byte-identical to the arm64 build. The arch comes from dist.mjs and
# nowhere else; the CI matrix supplies one runner per architecture.
win:
  target:
    - nsis
  icon: assets/installer/icon.ico
  # Match the running app's identity so taskbar / notifications / installer agree.
  legalTrademarks: Limboo
  # `publisherName` is INTENTIONALLY ABSENT, and `verifyUpdateCodeSignature` is
  # INTENTIONALLY false. Both guard the same failure.
  #
  # electron-updater runs its Authenticode check on a downloaded installer only
  # when app-update.yml carries a publisherName, and that check demands
  # `Get-AuthenticodeSignature ... Status == Valid`. The current signing route is
  # a self-signed certificate, which is in no user's trust store and so can never
  # be Valid — publishing a publisherName would make every Windows auto-update
  # fail with "New version is not signed by the application owner", and the only
  # remedy for an affected user is a manual reinstall.
  #
  # Omitting the key is not enough on its own: with verifyUpdateCodeSignature at
  # its default `true`, PublishManager DERIVES publisherName from the signing
  # certificate's CN (see windowsSignToolManager `computedPublisherName`) and
  # writes it into app-update.yml for us. Setting it false is what actually stops
  # that.
  #
  # scripts/signing.cjs flips this back to true on the Azure Trusted Signing
  # route, where the chain IS trusted and verification is worth having.
  # ci/scripts/verify-signing.mjs enforces the invariant.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false                         # full assisted multi-page wizard
  perMachine: false                       # per-user install (no UAC friction)
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/installer/icon.ico
  uninstallerIcon: assets/installer/icon.ico
  installerHeaderIcon: assets/installer/icon.ico
  installerSidebar: assets/installer/installerSidebar.bmp
  uninstallerSidebar: assets/installer/uninstallerSidebar.bmp
  installerHeader: assets/installer/installerHeader.bmp
  license: LICENSE
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Limboo
  # Root-level Start-menu shortcut (no vendor subfolder) — the modern Windows
  # standard, and it keeps "Recently added" from resolving into a stale
  # subfolder entry left by older installs (installer.nsh scrubs those).
  menuCategory: false
  runAfterFinish: true
  # Preserve the user's workspaces / limboo.db / memories / logs / terminal
  # history on uninstall — never wipe userData automatically.
  deleteAppDataOnUninstall: false
  # Detect previous installs and upgrade cleanly without data loss.
  differentialPackage: false
  include: assets/installer/installer.nsh
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

# ---------------------------------------------------------------------------
# macOS — dmg + zip (zip is required for electron-updater to self-update).
# electron-builder converts the 512px PNG to .icns automatically on the runner.
#
# Signing and notarization do NOT happen here. Under `--prepackaged`,
# `platformPackager.doPack()` returns early and `signApp` never runs, so
# electron-builder cannot sign the bundle whatever this file says. Forge signs
# the app instead (forge.config.ts + scripts/signing.cjs); the keys below are
# kept because electron-builder still records them into the artifacts' metadata.
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: Limboo ${version}

# ---------------------------------------------------------------------------
# Linux — AppImage (required for electron-updater self-update) + deb + rpm +
# pacman (Arch / Manjaro) + tar.gz (the distro-agnostic fallback).
#
# electron-updater 6.8 can install every one of these: AppImage replaces itself
# in place, and deb/rpm/pacman shell out to the system package manager through
# pkexec/sudo. Which implementation runs is decided by AutoUpdateManager, not by
# electron-updater's own dispatch — see that file for why.
# ---------------------------------------------------------------------------
linux:
  category: Development
  icon: assets/icon.png
  synopsis: The operating system for AI software development
  # MUST match the binary Forge produces (packagerConfig.name = 'Limboo'), which
  # `--prepackaged` hands over as-is. electron-builder does NOT read that name:
  # it defaults executableName to package.json `name` ('limboo', lowercase) and
  # writes every Linux launcher path from it. Without this, v1.5.0 shipped an
  # AppRun that exec'd a non-existent `limboo` (the AppImage could not start at
  # all), a .desktop `Exec=/opt/Limboo/limboo`, and a dangling
  # /usr/bin/limboo symlink. Case matters on Linux — keep these two in sync.
  executableName: Limboo
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  # Include the arch in every Linux filename so the arm64 artifacts published by
  # the GitHub Actions supplement cannot collide with the x64 ones GitLab builds.
  artifactName: ${name}-${version}-${arch}.${ext}

# ---------------------------------------------------------------------------
# Microsoft Store (MSIX/AppX) — the warning-free Windows channel.
#
# The Store re-signs submitted packages with a Microsoft-trusted certificate, so
# a Store install shows no SmartScreen prompt without us owning a certificate at
# all. In exchange, the Store owns updates: AutoUpdateManager detects
# `process.windowsStore` and disables self-update in these builds.
#
# The identity values come from Partner Center (Product management → Product
# identity) and are injected as `--config.appx.*` at build time by CI, so no
# account-specific data lives in the repo. Without them the appx target is not
# requested at all.
#
# This is a Desktop Bridge package: MSIX-packaged Win32 apps declare
# `runFullTrust`, which is not an AppContainer sandbox — spawning cursor-agent,
# git and node-pty PTYs works as it does outside the package.
# ---------------------------------------------------------------------------
appx:
  applicationId: Limboo
  displayName: Limboo
  backgroundColor: "#000000"
  showNameOnTiles: true
  languages: [en-US]
  artifactName: ${productName}-${version}-${arch}.${ext}
