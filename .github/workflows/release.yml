name: Release (manual fallback)

# Manual FALLBACK release publisher. The GitLab pipeline (.gitlab-ci.yml, `release`
# stage) is the primary publisher and runs automatically on every `v*` tag — this
# workflow deliberately has NO tag trigger so the two can never both publish the same
# release. Dispatch it only when GitLab is unavailable: it reuses the CD packaging
# workflow (with attestations enabled), generates categorized release notes, and
# publishes a GitHub Release with installers + SHA256SUMS + SBOM.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    # Fail fast before the multi-OS package matrix: the dispatched tag must look
    # like a version tag AND actually exist on the remote. Skipping this wastes an
    # entire package run on a typo or a not-yet-pushed tag.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::inputs.tag is empty." ; exit 1
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is malformed — expected vMAJOR.MINOR.PATCH[-prerelease]." ; exit 1
          fi
      - name: Check tag exists on remote
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in ${GITHUB_REPOSITORY}. Push it first." ; exit 1
          fi
          echo "Validated $TAG"

  package:
    name: Package + attest
    needs: [validate]
    uses: ./.github/workflows/_package.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ inputs.tag }}
      attest: true
      # The fallback must be able to produce the COMPLETE release on its own, so
      # it runs every architecture — including the ones GitLab's SaaS runners
      # cannot build (Intel macOS, arm64 Linux, arm64 Windows).
      runners: >-
        ["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "macos-15-intel",
         "windows-2022", "windows-11-arm"]

  publish:
    name: Publish GitHub Release
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0   # full history so release notes can diff from the prev tag

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Deliberately NOT merge-multiple: two macOS runners both emit
          # `latest-mac.yml` (arm64 and x64), and a flat merge would let one
          # silently overwrite the other — removing an entire architecture from
          # the update feed. They are merged explicitly in the next step.
          merge-multiple: false

      - name: Merge update feeds and assemble the publish set
        run: |
          set -euo pipefail
          mkdir -p dist
          # Feeds first: the merger unions the `files:` arrays per platform.
          node ci/scripts/merge-update-metadata.mjs dist artifacts/*/
          # Then every non-feed artifact. Feeds are skipped so the merged copies
          # written above are not clobbered by a per-runner original.
          for file in artifacts/*/*; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in
              latest*.yml) continue ;;
              builder-debug.yml|builder-effective-config.yaml) continue ;;
              SHA256SUMS) continue ;;
              # anchore/sbom-action writes this alongside the SBOM we asked for,
              # and it is NOT in the release upload globs below. Left in place it
              # lands in SHA256SUMS without ever being published, so
              # `sha256sum -c SHA256SUMS` fails on a file the user cannot
              # download — breaking the very command the release notes give them.
              *.cyclonedx.json) continue ;;
            esac
            cp -n "$file" dist/
          done
          ls -la dist

      - name: Verify artifact structure
        run: node ci/scripts/verify-artifacts.mjs dist --publish-set

      - name: Generate release manifest
        # The machine-readable description of this release: the same structured
        # notes the app carries, plus every artifact's size and SHA-256. Written
        # BEFORE the checksums so SHA256SUMS covers it.
        run: node ci/scripts/generate-release-manifest.mjs dist "${{ inputs.tag }}"

      - name: Consolidate checksums
        # Each OS produced its own SHA256SUMS; combine into one top-level manifest.
        run: node ci/scripts/make-checksums.mjs dist SHA256SUMS

      - name: Verify release manifest
        # Proves the manifest and SHA256SUMS describe the same download. Two
        # files that disagree would give a false result to whichever one a user
        # happened to verify against.
        run: node ci/scripts/check-release-manifest.mjs dist "${{ inputs.tag }}"

      - name: Generate release notes
        run: node ci/scripts/generate-release-notes.mjs "${{ inputs.tag }}" RELEASE_NOTES.md

      # Created as a DRAFT, then published in the next step.
      #
      # This repository has immutable releases enabled, which forbids adding an
      # asset to a release that is already published — and the action publishes
      # first, then uploads. With `draft: false` every upload failed with
      # "Cannot upload asset … to an immutable release", leaving a published
      # prerelease with ZERO downloads: visible to users, and useless to a
      # client looking for `latest*.yml`. A draft accepts assets, so the release
      # only becomes visible once it is complete.
      #
      # This affects stable releases exactly as much as prereleases; it only
      # surfaced now because this is the first release published through this
      # workflow since immutability was turned on.
      #
      # A TAG IS BURNED BY A FAILED PUBLISH. Once a tag has been used by an
      # immutable release, GitHub reserves it permanently — deleting the release
      # does NOT free it, and a later attempt fails with
      # "HTTP 422: tag_name was used by an immutable release". v1.18.0-beta.1 was
      # lost that way: the release was deleted, the assets uploaded cleanly into
      # a fresh draft, and that draft could then never be published. If this job
      # ever fails at the publish step again, do not retry the same tag —
      # increment it.
      - name: Stage release as a draft
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Limboo ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          # The *.yml + *.blockmap files are electron-builder's auto-update metadata
          # — electron-updater reads latest.yml / latest-mac.yml / latest-linux.yml
          # from the Release to detect and verify new versions. They MUST be attached.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*.appx
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/*.cdx.json
            # The structured release description the app's release document
            # reads. This list is an explicit ALLOWLIST of extensions, not a
            # glob — v1.8.0 generated and verified the manifest and then never
            # uploaded it, because `release-manifest.json` matches none of the
            # patterns above. Anything new added to dist/ needs a line here.
            dist/release-manifest.json
            SHA256SUMS

      # Flip the completed draft to visible. Separate from the upload so a
      # release is never publicly readable in a half-uploaded state, and so a
      # failed upload leaves a draft to inspect rather than an empty release
      # users can see. `--verify-tag` is not available on `release edit`; the
      # tag was already verified by the `validate` job.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published ${{ inputs.tag }} with $(gh release view "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length') asset(s)."

      # An empty release is the failure mode this whole two-step exists to
      # prevent, so assert it did not happen rather than trust that it did not.
      # A published release with no assets offers a client nothing to download
      # and cannot be repaired in place on an immutable-releases repository.
      - name: Verify the published release carries its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets | length')
          if [ "$count" -lt 5 ]; then
            echo "::error::Published ${{ inputs.tag }} with only $count asset(s)." >&2
            exit 1
          fi
          # The update feeds are what make a release installable at all.
          for feed in latest.yml latest-mac.yml latest-linux.yml; do
            gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[].name' | grep -qx "$feed" \
              || echo "::warning::$feed is not attached — that platform cannot auto-update."
          done
