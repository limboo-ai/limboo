name: Package (reusable)

# Reusable CD build: packages platform installers, generates an SBOM + checksums,
# verifies signing where configured, and emits build-provenance + SBOM
# attestations. Called by cd.yml (manual dry-run) and release.yml (tags). Keeping
# the build in ONE reusable workflow is what lets every caller produce identical
# artifacts and moves toward SLSA Build L3 (isolated, vetted build instructions).

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (empty = the caller's own ref)
        type: string
        required: false
        default: ""
      attest:
        description: Generate provenance/SBOM attestations
        type: boolean
        required: false
        default: false
      runners:
        # A JSON array of runner labels. Defaults to the primary matrix; the
        # tag-triggered supplement (release-supplement.yml) passes the labels
        # GitLab's SaaS runners cannot provide — Intel macOS and arm64 Linux /
        # Windows — so one reusable build definition serves both paths.
        description: JSON array of runner labels to build on
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    permissions:
      contents: read
      id-token: write        # OIDC for attestations
      attestations: write     # write artifact attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        # rpm/dpkg + native module toolchain for deb/rpm/AppImage, plus
        # libarchive-tools for bsdtar — fpm shells out to it when building the
        # pacman target and fails late with a bare exit code 127 without it.
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 rpm fakeroot dpkg libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Apply version from tag
        # Tag-driven versioning: stamp package.json with the tag version before
        # building so the installers + latest*.yml match the Release. `inputs.ref` is
        # the tag on the release.yml path; a non-tag ref (cd.yml dry-run) is a no-op.
        run: node ci/scripts/apply-tag-version.mjs "${{ inputs.ref }}"

      - name: Embed release manifest facts
        # Stamps the git-derived half of src/shared/releaseManifest.generated.ts
        # (commit, build number, contributors, PRs, branches, stats) BEFORE the
        # bundle is built, so the app carries them. Ephemeral like the version
        # stamp above, and a no-op off a tag.
        #
        # The token is what turns a commit email into a real account: it lets the
        # step resolve contributors through the GitHub API and embed their
        # profile picture as a data: URI. Read-only and entirely optional — the
        # step falls back to git-derived names and monograms without it, and
        # never fails the build over a profile lookup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ci/scripts/embed-release-manifest.mjs "${{ inputs.ref }}"

      - name: Build branded installers (Forge package + electron-builder)
        # Forge packages the app (Vite build + security fuses + asar layout); then
        # electron-builder wraps that prepackaged dir into the branded NSIS / dmg /
        # AppImage targets and emits the latest*.yml auto-update metadata. `--publish
        # never` keeps this reusable build side-effect-free; release.yml publishes.
        run: npm run dist -- --publish never

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/limboo-sbom.cdx.json

      - name: Compute checksums
        run: node ci/scripts/make-checksums.mjs dist dist/SHA256SUMS

      - name: Verify code signing (skips when unsigned)
        run: node ci/scripts/verify-signing.mjs dist

      - name: Verify artifact structure
        # Catches the two defects that shipped in v1.5.1 and that checksums and
        # signatures cannot detect: a macOS update zip not rooted at the .app
        # (Squirrel.Mac can never install it) and two architectures published
        # under different names from the same build.
        run: node ci/scripts/verify-artifacts.mjs dist

      - name: Attest build provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.pacman
            dist/**/*.tar.gz
            dist/**/*.appx
            dist/**/*.zip

      - name: Attest SBOM
        if: ${{ inputs.attest }}
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/SHA256SUMS
          sbom-path: dist/limboo-sbom.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Keyed on the runner LABEL, not runner.os: macos-latest (arm64) and
          # macos-15-intel (x64) are both "macOS" and would overwrite each other.
          name: limboo-${{ matrix.os }}
          # Includes the installers AND the latest*.yml update metadata + .blockmap
          # files electron-updater needs — they must reach the GitHub Release.
          path: dist/**/*
          if-no-files-found: error
          retention-days: 14
